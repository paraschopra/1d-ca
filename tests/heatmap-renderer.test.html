<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Heatmap Renderer Tests</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff88;
        }
        .test-result {
            margin: 10px 0;
            padding: 5px;
        }
        .pass { color: #00ff88; }
        .fail { color: #ff0088; }
        .visual-test {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #333;
            display: inline-block;
        }
        canvas {
            border: 1px solid #666;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <h1>Canvas Heatmap Renderer Tests</h1>
    <div id="results"></div>

    <div class="visual-test">
        <h3>Test 1: All zeros (should be uniform min color)</h3>
        <canvas id="canvas-zeros" width="10" height="10"></canvas>
    </div>

    <div class="visual-test">
        <h3>Test 2: All ones (should be uniform max color)</h3>
        <canvas id="canvas-ones" width="10" height="10"></canvas>
    </div>

    <div class="visual-test">
        <h3>Test 3: Linear gradient (0 to 1)</h3>
        <canvas id="canvas-gradient" width="10" height="10"></canvas>
    </div>

    <div class="visual-test">
        <h3>Test 4: Checkerboard pattern</h3>
        <canvas id="canvas-checkerboard" width="16" height="16"></canvas>
    </div>

    <div class="visual-test">
        <h3>Test 5: Light cone pattern (expanding cone)</h3>
        <canvas id="canvas-cone" width="64" height="64"></canvas>
    </div>

    <script>
        // Placeholder for the real implementation
        function createHeatmap(canvas, matrix, config = {}) {
            // Default color config: black → cyan → white gradient
            const colorMin = config.colorMin || [0, 0, 0];
            const colorMid = config.colorMid || [0, 255, 255];
            const colorMax = config.colorMax || [255, 255, 255];

            const rows = matrix.length;
            const cols = matrix[0].length;

            // Set canvas size to match matrix
            canvas.width = cols;
            canvas.height = rows;

            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(cols, rows);

            // Find min/max values in matrix
            let min = Infinity;
            let max = -Infinity;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const val = matrix[r][c];
                    if (val < min) min = val;
                    if (val > max) max = val;
                }
            }

            // Handle edge case where all values are the same
            const range = max - min || 1;

            // Map values to colors
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const val = matrix[r][c];
                    const normalized = (val - min) / range; // 0 to 1

                    const idx = (r * cols + c) * 4;

                    // Three-point gradient: 0 → 0.5 → 1.0
                    let color;
                    if (normalized < 0.5) {
                        // Interpolate between colorMin and colorMid
                        const t = normalized * 2; // 0 to 1
                        color = [
                            Math.round(colorMin[0] + (colorMid[0] - colorMin[0]) * t),
                            Math.round(colorMin[1] + (colorMid[1] - colorMin[1]) * t),
                            Math.round(colorMin[2] + (colorMid[2] - colorMin[2]) * t)
                        ];
                    } else {
                        // Interpolate between colorMid and colorMax
                        const t = (normalized - 0.5) * 2; // 0 to 1
                        color = [
                            Math.round(colorMid[0] + (colorMax[0] - colorMid[0]) * t),
                            Math.round(colorMid[1] + (colorMax[1] - colorMid[1]) * t),
                            Math.round(colorMid[2] + (colorMax[2] - colorMid[2]) * t)
                        ];
                    }

                    imageData.data[idx] = color[0];
                    imageData.data[idx + 1] = color[1];
                    imageData.data[idx + 2] = color[2];
                    imageData.data[idx + 3] = 255; // Alpha
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        // Test Suite
        const results = [];

        function test(name, fn) {
            try {
                fn();
                results.push({ name, pass: true });
            } catch (e) {
                results.push({ name, pass: false, error: e.message });
            }
        }

        // Test 1: All zeros
        test('All zeros renders as uniform color', () => {
            const canvas = document.getElementById('canvas-zeros');
            const matrix = Array(10).fill(null).map(() => Array(10).fill(0));
            createHeatmap(canvas, matrix);

            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, 10, 10);

            // Check that all pixels are the same (min color = black = [0,0,0])
            const firstPixel = [imageData.data[0], imageData.data[1], imageData.data[2]];
            for (let i = 0; i < imageData.data.length; i += 4) {
                if (imageData.data[i] !== firstPixel[0] ||
                    imageData.data[i+1] !== firstPixel[1] ||
                    imageData.data[i+2] !== firstPixel[2]) {
                    throw new Error('Pixels are not uniform');
                }
            }
        });

        // Test 2: All ones
        test('All ones renders as uniform color', () => {
            const canvas = document.getElementById('canvas-ones');
            const matrix = Array(10).fill(null).map(() => Array(10).fill(1));
            createHeatmap(canvas, matrix);

            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, 10, 10);

            // Check that all pixels are the same (max color = white = [255,255,255])
            const firstPixel = [imageData.data[0], imageData.data[1], imageData.data[2]];
            for (let i = 0; i < imageData.data.length; i += 4) {
                if (imageData.data[i] !== firstPixel[0] ||
                    imageData.data[i+1] !== firstPixel[1] ||
                    imageData.data[i+2] !== firstPixel[2]) {
                    throw new Error('Pixels are not uniform');
                }
            }
        });

        // Test 3: Canvas size matches matrix
        test('Canvas dimensions match matrix dimensions', () => {
            const canvas = document.createElement('canvas');
            const matrix = Array(15).fill(null).map(() => Array(20).fill(0.5));
            createHeatmap(canvas, matrix);

            if (canvas.width !== 20 || canvas.height !== 15) {
                throw new Error(`Canvas size mismatch: expected 20x15, got ${canvas.width}x${canvas.height}`);
            }
        });

        // Test 4: Gradient shows variation
        test('Mixed values show visible gradient', () => {
            const canvas = document.getElementById('canvas-gradient');
            const matrix = Array(10).fill(null).map((_, i) =>
                Array(10).fill(null).map((_, j) => i / 10)
            );
            createHeatmap(canvas, matrix);

            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, 10, 10);

            // Check that first row is different from last row
            const firstRowPixel = [imageData.data[0], imageData.data[1], imageData.data[2]];
            const lastRowPixel = [imageData.data[(9 * 10) * 4], imageData.data[(9 * 10) * 4 + 1], imageData.data[(9 * 10) * 4 + 2]];

            const diff = Math.abs(firstRowPixel[0] - lastRowPixel[0]) +
                         Math.abs(firstRowPixel[1] - lastRowPixel[1]) +
                         Math.abs(firstRowPixel[2] - lastRowPixel[2]);

            if (diff < 50) throw new Error('Gradient not visible enough');
        });

        // Test 5: Color mapping is linear
        test('Value 0.5 maps to mid-point color', () => {
            const canvas = document.createElement('canvas');
            const matrix = [[0.5]];
            createHeatmap(canvas, matrix);

            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, 1, 1);
            const pixel = [imageData.data[0], imageData.data[1], imageData.data[2]];

            // Default mid color is cyan [0, 255, 255]
            const expectedMid = [0, 255, 255];
            const tolerance = 2; // Allow small rounding errors

            if (Math.abs(pixel[0] - expectedMid[0]) > tolerance ||
                Math.abs(pixel[1] - expectedMid[1]) > tolerance ||
                Math.abs(pixel[2] - expectedMid[2]) > tolerance) {
                throw new Error(`Mid-point color incorrect: expected ~[0,255,255], got [${pixel}]`);
            }
        });

        // Test 6: Edge case - single value matrix
        test('Single value matrix handles edge case', () => {
            const canvas = document.createElement('canvas');
            const matrix = [[0.7]];
            createHeatmap(canvas, matrix);

            if (canvas.width !== 1 || canvas.height !== 1) {
                throw new Error('Single value matrix size incorrect');
            }
        });

        // Test 7: Custom color config
        test('Custom color config is respected', () => {
            const canvas = document.createElement('canvas');
            const matrix = [[0]];
            const config = {
                colorMin: [255, 0, 0], // Red
                colorMid: [0, 255, 0], // Green
                colorMax: [0, 0, 255]  // Blue
            };
            createHeatmap(canvas, matrix, config);

            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, 1, 1);
            const pixel = [imageData.data[0], imageData.data[1], imageData.data[2]];

            // Should be red [255, 0, 0]
            if (pixel[0] !== 255 || pixel[1] !== 0 || pixel[2] !== 0) {
                throw new Error(`Custom min color not applied: expected [255,0,0], got [${pixel}]`);
            }
        });

        // Display results
        const resultsDiv = document.getElementById('results');
        const passCount = results.filter(r => r.pass).length;

        resultsDiv.innerHTML = `<h2>Results: ${passCount}/${results.length} passed</h2>`;
        results.forEach(r => {
            const div = document.createElement('div');
            div.className = `test-result ${r.pass ? 'pass' : 'fail'}`;
            div.textContent = `${r.pass ? '✓' : '✗'} ${r.name}${r.error ? ': ' + r.error : ''}`;
            resultsDiv.appendChild(div);
        });

        // Create visual tests
        // Test 1: All zeros
        const canvas1 = document.getElementById('canvas-zeros');
        const matrix1 = Array(10).fill(null).map(() => Array(10).fill(0));
        createHeatmap(canvas1, matrix1);
        canvas1.style.width = '100px';
        canvas1.style.height = '100px';

        // Test 2: All ones
        const canvas2 = document.getElementById('canvas-ones');
        const matrix2 = Array(10).fill(null).map(() => Array(10).fill(1));
        createHeatmap(canvas2, matrix2);
        canvas2.style.width = '100px';
        canvas2.style.height = '100px';

        // Test 3: Linear gradient
        const canvas3 = document.getElementById('canvas-gradient');
        const matrix3 = Array(10).fill(null).map((_, i) =>
            Array(10).fill(null).map((_, j) => i / 10)
        );
        createHeatmap(canvas3, matrix3);
        canvas3.style.width = '200px';
        canvas3.style.height = '200px';

        // Test 4: Checkerboard
        const canvas4 = document.getElementById('canvas-checkerboard');
        const matrix4 = Array(16).fill(null).map((_, i) =>
            Array(16).fill(null).map((_, j) => (i + j) % 2)
        );
        createHeatmap(canvas4, matrix4);
        canvas4.style.width = '200px';
        canvas4.style.height = '200px';

        // Test 5: Light cone pattern
        const canvas5 = document.getElementById('canvas-cone');
        const matrix5 = Array(64).fill(null).map((_, y) =>
            Array(64).fill(null).map((_, x) => {
                // Create a cone emanating from center top
                const centerX = 32;
                const distance = Math.abs(x - centerX);
                return (distance <= y) ? 1 : 0;
            })
        );
        createHeatmap(canvas5, matrix5);
        canvas5.style.width = '300px';
        canvas5.style.height = '300px';
    </script>
</body>
</html>
